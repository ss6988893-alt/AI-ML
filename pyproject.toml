[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Educational synthetic transaction fraud risk platform"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.4", "xgboost>=2.0",
  "joblib>=1.3", "fastapi>=0.110", "uvicorn[standard]>=0.27",
  "pydantic-settings>=2.2", "sqlalchemy>=2.0", "psycopg[binary]>=3.1",
  "alembic>=1.13", "mlflow>=2.12", "shap>=0.45", "streamlit>=1.33",
  "plotly>=5.20", "httpx>=0.27", "pyarrow>=14"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires an external service such as PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py310"
